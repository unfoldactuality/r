<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UnfoldActuality — Exploring what is actually true, within us and around us.">
  <title>UnfoldActuality</title>
  <link rel="icon" href="ua.ico">

  <style>
    :root {
      --bg: #f7f7f4;
      --text: #171717;
      --muted: #6b6b67;
      --line: #deded8;
      --card: #ffffff;
      --card-hover: #f0f0eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      padding: 56px 20px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand {
      text-align: center;
    }

    .profile-logo {
      width: 112px;
      height: 112px;
      display: block;
      margin: 0 auto 22px;
      object-fit: contain;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--line);
      padding: 14px;
    }

    .brand-name {
      font-size: clamp(2rem, 9vw, 3.25rem);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.055em;
    }

    .tagline {
      max-width: 500px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(0.98rem, 4vw, 1.12rem);
      line-height: 1.55;
      letter-spacing: -0.01em;
    }

    .languages {
      width: 100%;
      margin-top: 42px;
      display: grid;
      gap: 13px;
    }

    .language-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      padding: 16px 19px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      transition: background 160ms ease, transform 160ms ease, border-color 160ms ease;
    }

    .language-card:hover,
    .language-card:focus-visible {
      background: var(--card-hover);
      border-color: #c9c9c2;
      transform: translateY(-1px);
      outline: none;
    }

    .language-card:focus-visible {
      box-shadow: 0 0 0 3px rgba(23, 23, 23, 0.12);
    }

    .language-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .language-name {
      font-size: 1.08rem;
      font-weight: 700;
    }

    .language-description {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .arrow {
      font-size: 1.35rem;
      line-height: 1;
      margin-left: 16px;
    }

    .socials {
      width: 100%;
      margin-top: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
    }

    .social-link {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      background: transparent;
      transition: background 160ms ease, color 160ms ease;
    }

    .social-icon {
      width: 21px;
      height: 21px;
      fill: currentColor;
    }

    .social-link:hover,
    .social-link:focus-visible {
      background: var(--card);
      border-color: #c9c9c2;
      outline: none;
    }

    .about-link {
      width: 100%;
      min-height: 52px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.94rem;
      background: transparent;
      transition: background 160ms ease, border-color 160ms ease;
    }

    .about-link:hover,
    .about-link:focus-visible {
      background: var(--card);
      border-color: #c9c9c2;
      outline: none;
    }

    footer {
      margin-top: auto;
      padding-top: 54px;
      color: #8a8a84;
      text-align: center;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      main {
        padding: 42px 16px 26px;
      }

      .tagline {
        margin-top: 15px;
      }

      .languages {
        margin-top: 34px;
      }

      .language-card {
        min-height: 64px;
        padding: 14px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .language-card,
      .social-link,
      .about-link {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <header class="brand">
      <img class="profile-logo" src="ua.png" alt="UnfoldActuality logo">
      <h1 class="brand-name">UnfoldActuality</h1>
      <p class="tagline">
        Exploring what is actually true — within us and around us.
      </p>
    </header>

    <nav class="languages" aria-label="Choose language">
      <a class="language-card" data-url="https://ko-fi.com/spmhq" role="link" tabindex="0">
        <span class="language-info">
          <span class="language-name">English</span>
          <span class="language-description">Explore the UnfoldActuality</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="language-card" data-url="https://bn.unfoldactuality.online/" role="link" tabindex="0">
        <span class="language-info">
          <span class="language-name">বাংলা</span>
          <span class="language-description">UnfoldActuality বাংলা ব্লগ</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="language-card" data-url="https://hi.unfoldactuality.online/" role="link" tabindex="0">
        <span class="language-info">
          <span class="language-name">हिन्दी</span>
          <span class="language-description">UnfoldActuality हिन्दी ब्लॉग</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <section class="socials" aria-label="Social links">
      <a class="social-link" data-url="https://x.com/unfoldactuality" target="_blank" rel="noopener noreferrer" aria-label="UnfoldActuality on X" role="link" tabindex="0">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18.244 2H21.5l-7.11 8.13L22.75 22h-6.617l-5.18-6.777L5.024 22H1.767l7.604-8.684L1.25 2H8.04l4.682 6.19L18.244 2Zm-1.143 17.923h1.803L6.979 3.98H5.044L17.101 19.923Z"/>
        </svg>
        
      </a>

      <a class="social-link" data-url="https://www.facebook.com/unfoldactuality/" target="_blank" rel="noopener noreferrer" aria-label="UnfoldActuality on Facebook" role="link" tabindex="0">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07c0 6.02 4.39 11 10.13 11.93v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.55-4.69 1.32 0 2.7.24 2.7.24v2.98h-1.52c-1.5 0-1.97.94-1.97 1.9v2.28h3.35l-.54 3.49h-2.81V24C19.61 23.07 24 18.09 24 12.07Z"/>
        </svg>
        
      </a>

      <!-- Add your WhatsApp Channel URL to href when the channel is created. -->
      <a class="social-link" data-url="#" aria-label="UnfoldActuality WhatsApp Channel" role="link" tabindex="0">
        <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12.04 2C6.52 2 2.03 6.49 2.03 12c0 1.77.46 3.43 1.27 4.87L2 22l5.25-1.37A9.93 9.93 0 0 0 12.04 22C17.56 22 22 17.51 22 12S17.56 2 12.04 2Zm0 18.18c-1.55 0-3.07-.42-4.4-1.22l-.31-.19-3.11.81.83-3.03-.2-.32A8.2 8.2 0 1 1 12.04 20.18Zm4.49-6.14c-.25-.13-1.47-.73-1.7-.81-.23-.08-.39-.13-.55.13-.16.25-.63.81-.77.98-.14.17-.28.19-.52.06-.25-.13-1.04-.38-1.98-1.22-.73-.65-1.22-1.45-1.36-1.69-.14-.25-.02-.38.11-.5.11-.11.25-.28.37-.42.12-.14.16-.24.24-.4.08-.17.04-.31-.02-.44-.06-.13-.55-1.33-.76-1.82-.2-.48-.4-.42-.55-.43h-.47c-.16 0-.42.06-.64.31-.22.25-.84.82-.84 2s.86 2.32.98 2.48c.12.17 1.68 2.57 4.07 3.6.57.25 1.02.4 1.37.51.58.18 1.11.15 1.53.09.47-.07 1.47-.6 1.68-1.18.21-.58.21-1.08.15-1.18-.06-.1-.22-.16-.47-.29Z"/>
        </svg>
        
      </a>

    </section>

    <a class="about-link" data-url="about.html" role="link" tabindex="0">About UnfoldActuality</a>

    <footer>
      Copyright &copy; <span id="year"></span> UnfoldActuality.online All Rights Reserved.
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    document.querySelectorAll("[data-url]").forEach(function (link) {
      function navigate() {
        const url = link.getAttribute("data-url");
        if (!url || url === "#") return;

        if (link.getAttribute("target") === "_blank") {
          window.open(url, "_blank", "noopener,noreferrer");
        } else {
          window.location.href = url;
        }
      }

      link.addEventListener("click", function (event) {
        event.preventDefault();
        navigate();
      });

      link.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          navigate();
        }
      });
    });
  </script>
</body>
</html>
